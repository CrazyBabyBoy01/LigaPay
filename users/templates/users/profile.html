{% extends "users/base.html" %}
{% load static %}

{% block content %}
  <h2 class="header__title">
    {{title}}
  </h2>
  <div class="header__avatar">
    <img width="100" height="100" src="{% if user.image %} {{user.image.url}} {% else %} {% static "deps/images/profile.png" %} {% endif %}" alt="" >
   </div>
  <form action={% url "users:profile" user.id %} method='post' class="header__form-container" enctype="multipart/form-data">
    {% csrf_token %}
      {{form.image}}
      <label class="btn_avatar" for="{{form.image.id_for_label}}">Изменить аватар</label>
      <label class="btn_avatar" for=""><a href="#">Изменить пароль</a></label>
      <label class="btn_avatar" for=""><a href="#">Изменить почту</a></label>
      <label class="btn_avatar" href="" for=""> <a href="{% url "users:logout" %}">Выйти из профиля</a></label>
    <div class="form-container">
      <div class="input-group">
          <label for="{{form.username.id_for_label}}">Имя пользователя</label>
          {{form.username}}
      </div>
      <div class="input-group">
          <label for="{{form.email.id_for_label}}">Адрес эл.почты</label>
          {{form.email}}
      </div>
      <div class="input-group">
          <label for="{{form.first_name.id_for_label}}">Имя</label>
          {{form.first_name}}
      </div>
      <div class="input-group">
          <label for="{{form.last_name.id_for_label}}">Фамилия</label>
          {{form.last_name}}
      </div>
    </div>
    <button class="header__btn" type="submit">Сохранить</button>
  </form>
{% endblock content %}
