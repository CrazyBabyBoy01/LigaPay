{% extends "users/base.html" %}
{% load static %}


{% block content %}
    <h2>Смена электронной почты</h2>

    <form method="post">
        {% csrf_token %}

        <div class="reset-form form">
            {{ form.new_email }}
            {% for error in form.new_email.errors %}
                <div class="text-danger">{{ error }}</div>
            {% endfor %}
        </div>
        <div>
            <label>Текущий адрес электронной почты:</label>
            <span>{{ request.user.email }}</span>
        </div>

        <button type="submit" class="header__btn">Отправить</button>
    </form>
{% endblock content %}
