name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
    lint:
      runs-on: ubuntu-latest

      steps:
        - name: Get the repository code
          uses: actions/checkout@v3

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.12'
        - name: Install deps
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        - name: Run Ruff
          run: |
            ruff check
    test:
      needs: lint
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:14
          env:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: test_db
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
          ports:
            - 5432:5432

        redis:
          image: redis:7
          options: >-
            --health-cmd "redis-cli ping"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
          ports:
            - 6379:6379


      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.12'

        - name: Install deps
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        - name: Create .env file
          run: |
            echo "${{ secrets.ENV }}" > .env

        - name: Run Tests
          run: |
            cd .
            python3 manage.py test .





