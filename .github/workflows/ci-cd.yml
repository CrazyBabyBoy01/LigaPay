name: CI

on: push
jobs:
    lint:
      runs-on: ubuntu-latest
      steps:
        - name: Get the repository code
          uses: actions/checkout@v3

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.12'
        - name: Install deps
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        - name: Run Ruff
          run: |
            ruff check
