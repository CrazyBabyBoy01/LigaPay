{% extends "main/base.html" %}
{% load static %}

{% block content %}
<h2>Пополнить баланс</h2>
<form method="post">
    {% csrf_token %}
    <label for="amount">Сумма:</label>
    <input type="number" step="0.01" name="amount" required>
    <button type="submit">Пополнить</button>
</form>
{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}
{% endblock content %}
